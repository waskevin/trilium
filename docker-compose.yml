version: "3.8"

# TOS 7 Docker application - Trilium Notes
# Rules: Docker Hub image with a LOCKED version tag; non-root user;
#        no privileged mode, no host networking; data persisted via bind mounts.
# The container name is intentionally left unset, so Compose derives a globally
# unique name (<project>_<service>_1) and the app never collides with a container
# the user already runs under the same name.
#
# The v0.106.0 image ships the older start-docker.sh, which unconditionally remaps the
# `node` user, runs `chown -R node:node /home/node` and re-execs the server through `su`.
# All three steps need root: started as 1000:1000 the chown is refused and `su` cannot
# switch user without a password, so the container would restart in a loop. The server
# is therefore started directly - exactly what that script runs once it is done - and an
# explicit healthcheck is used, because the image's own HEALTHCHECK goes through
# `gosu node`, which also needs root.

services:
  trilium:
    image: triliumnext/trilium:v0.106.0
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "10004:8080"
    # Host path `/data` is the platform's documented absolute form: TOS maps it
    # to /Volume<N>/DockerAppData/trilium/data at install time (spec 9.3, rule 4).
    # Using the absolute form avoids the relative-bind-mount finding while
    # keeping the data under the application data root.
    volumes:
      - /data:/home/node/trilium-data
    environment:
      - TZ=Asia/Shanghai
    entrypoint: ["node", "main.mjs"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

x-app-meta:
  web:
    port: 10004
    protocol: http
