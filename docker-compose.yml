version: "3.8"

# TOS 7 Docker application - Trilium Notes
# Rules: Compose 3.8, Docker Hub image with a LOCKED version tag, non-root user,
#        no privileged mode, no network_mode: host, data persisted via bind mounts.
#
# container_name is intentionally omitted: Compose then derives a globally unique
# name (<project>_<service>_1), so the application never fails to install because
# the device already runs a container called "trilium".
#
# The upstream entrypoint handles both cases; started as 1000:1000 it skips the
# node remapping and runs the server directly as the non-root user. No credential
# is needed - Trilium asks for its own password in the web UI on first run.

services:
  trilium:
    image: triliumnext/trilium:v0.106.0
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "10004:8080"
    volumes:
      - ./data:/home/node/trilium-data
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

x-app-meta:
  web:
    port: 10004
    protocol: http
